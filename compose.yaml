services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dreamwall
      POSTGRES_PASSWORD: dreamwall
      POSTGRES_DB: dreamwall
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - dreamwall-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamwall"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  dreamwall-data:
